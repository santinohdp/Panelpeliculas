<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Películas y Series</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-8">
    <div class="text-center mb-8">
      <div class="mx-auto w-14 h-14 rounded-xl bg-purple-600 flex items-center justify-center text-2xl mb-3">🎬</div>
      <h1 class="text-xl font-semibold">Películas y Series</h1>
      <p class="text-slate-400 text-sm">Panel de administración</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Usuario</label>
        <input id="username" type="text" required autocomplete="username"
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Contraseña</label>
        <input id="password" type="password" required autocomplete="current-password"
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>

      <p id="errorMsg" class="text-red-400 text-sm hidden"></p>

      <button type="submit"
        class="w-full bg-purple-600 hover:bg-purple-500 transition rounded-lg py-2 font-medium">
        Ingresar
      </button>
    </form>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
